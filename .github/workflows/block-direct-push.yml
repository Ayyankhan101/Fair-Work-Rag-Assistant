name: Block Direct Push

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { payload } = context;
            // If triggered by a pull_request event, it's fine
            if (payload.pull_request) {
              return;
            }
            // If it's a merge queue or workflow dispatch, allow
            if (payload.workflow || payload.merge_group) {
              return;
            }
            // Otherwise it's a direct push - block it
            core.setFailed('Direct push to protected branch is not allowed. Please create a Pull Request.');
