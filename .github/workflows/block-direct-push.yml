name: Block Direct Push

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { payload } = context;
            if (payload.head_commit && !payload.pull_request) {
              const commits = payload.commits || [];
              const isDirectPush = !payload.workflow;
              
              if (isDirectPush && !payload.ref.startsWith('refs/pull/')) {
                core.setFailed('Direct push to protected branch is not allowed. Please create a Pull Request.');
              }
            }
