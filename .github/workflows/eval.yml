name: Run Eval

on:
  workflow_dispatch:
    inputs:
      eval_type:
        description: "Eval type"
        required: true
        default: "hard"
        type: choice
        options:
          - hard
          - basic

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore vectorstore cache
        uses: actions/cache@v4
        with:
          path: data/vectorstore
          key: vectorstore-${{ hashFiles('data/vectorstore/index.tvim') }}

      - name: Restore docs cache
        uses: actions/cache@v4
        with:
          path: data/docs_cache.pkl
          key: docs-cache-${{ hashFiles('data/docs_cache.pkl') }}

      - name: Run eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ inputs.eval_type }}" = "hard" ]; then
            python scripts/eval_hard.py
          else
            python scripts/eval_prd_questions.py
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ inputs.eval_type }}
          path: data/*eval_results.json
