name: Run Eval

on:
  workflow_dispatch:
    inputs:
      eval_type:
        description: "Eval type"
        required: true
        default: "hard"
        type: choice
        options:
          - hard
          - basic

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: eval
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore vectorstore cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/vectorstore
          key: vectorstore-${{ hashFiles('data/vectorstore/index.tvim') }}

      - name: Restore docs cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/docs_cache.pkl
          key: docs-cache-${{ hashFiles('data/docs_cache.pkl') }}

      - name: Run eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVAL_TYPE: ${{ inputs.eval_type }}
        run: |
          if [ "$EVAL_TYPE" = "hard" ]; then
            python scripts/eval_hard.py
          else
            python scripts/eval_prd_questions.py
          fi

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-${{ inputs.eval_type }}
          path: data/*eval_results.json
